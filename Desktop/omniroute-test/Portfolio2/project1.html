<!DOCTYPE html>
<html lang="fr">
<head>
    <script>
        (function () {
            var saved = localStorage.getItem("theme");
            if (saved === "light") {
                document.documentElement.setAttribute("data-theme", "light");
            }
        })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title">Projet 1 - Portfolio</title>
    <link rel="icon" type="image/png" href="favicon.png"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body data-project-index="0">
    <header class="header" id="header">
        <div class="container nav">
            <a href="index.html" class="logo" data-i18n="ui.logo">Mon Portfolio</a>

            <nav class="navbar" id="navbar">
                <a href="index.html#home" data-i18n="ui.nav.home">Accueil</a>
                <a href="index.html#about" data-i18n="ui.nav.about">À propos</a>
                <a href="index.html#projects" data-i18n="ui.nav.projects">Projets</a>
                <a href="contact.html" data-i18n="ui.nav.contact">Contact</a>
            </nav>

            <div class="nav-actions">
<button class="theme-toggle" id="theme-toggle" aria-label="Toggle light and dark theme">
                    <i class="fa-solid fa-sun theme-icon-light"></i>
                    <i class="fa-solid fa-moon theme-icon-dark"></i>
                </button>

                <div class="language-switcher">
                    <img src="fr-flag.png"
                        alt="Français"
                        onclick="changeLanguage('fr')">

                    <img src="uk-flag.png"
                        alt="English"
                        onclick="changeLanguage('en')">
                </div>

                <button class="menu-toggle" id="menu-toggle" aria-label="Open menu">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </div>
    </header>

    <section class="section" style="padding-top: 160px;">
        <div class="container">
            <div class="section-title reveal">
                <span class="eyebrow" id="project-eyebrow">Projet 01</span>
                <h2 id="project-title">Projet</h2>
                <p id="project-subtitle"></p>
            </div>

            <div class="about-grid project-detail-grid">
                <div class="project-image-frame reveal">
                    <div class="project-image-inner">
                        <div class="browser-bar">
                            <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
                            <span class="browser-url">portfolio.jsx</span>
                        </div>
                        <img id="project-image" src="project1.jpg" alt="Project image" />
                    </div>
                </div>

                <div class="card about-card reveal">
                    <h3 id="project-description-title">Description</h3>
                    <p id="project-description"></p>

                    <h3 id="project-technologies-title" style="margin-top: 20px;">Technologies</h3>
                    <p id="project-technologies"></p>

                    <h3 id="project-learned-title" style="margin-top: 20px;">Ce que j’ai appris</h3>
                    <p id="project-learned"></p>

                    <div class="hero-buttons" style="margin-top: 25px;">
                        <a id="source-code-button" href="https://github.com/Iakobgi/Portfolio" target="_blank" class="btn btn-primary">Code source</a>
                        <a id="live-preview-button" href="index.html" class="btn btn-secondary">Aperçu</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
